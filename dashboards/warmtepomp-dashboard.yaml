# Alpha Innotec WZS 81H/K Sensor-Only Telemetry Dashboard (Phase 1)
# Deployed to Home Assistant: dashboard-test / view: warmtepomp

title: Warmtepomp
path: warmtepomp
icon: mdi:heat-pump
type: sections

sections:
  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: Energie & Vermogen per Bedrijfsstand
        icon: mdi:lightning-bolt
      - type: entities
        title: Actuele Energiestatus & Totaal
        show_header_toggle: false
        entities:
          - entity: select.warmtepomp_energie
            name: "Actieve Energiemodus (Tarief)"
            icon: mdi:state-machine
          - entity: sensor.luxtronik_220131_0144_status
            name: "Luxtronik Bedrijfsstatus"
            icon: mdi:heat-pump
          - entity: sensor.energymonitor_warmtepomp_total_active_power
            name: "Actueel Totaal Vermogen"
            icon: mdi:flash
          - entity: sensor.warmtepomp_totaal_energie_dagelijks
            name: "Totaal Energie Vandaag (Dagelijks)"
            icon: mdi:calendar-today
          - entity: sensor.energymonitor_warmtepomp_total_active_energy
            name: "Totaal Energie Cumulatief (Shelly)"
            icon: mdi:counter
      - type: entities
        title: Energieverbruik per Modus (kWh)
        show_header_toggle: false
        entities:
          - entity: sensor.warmtepomp_energie_heating
            name: "1. Verwarmen (CV / Vloer)"
            icon: mdi:radiator
          - entity: sensor.warmtepomp_energie_hot_water
            name: "2. Warm Tapwater (DHW Boiler)"
            icon: mdi:water-boiler
          - entity: sensor.warmtepomp_energie_cooling
            name: "3. Passief Koelen (Comfort Board)"
            icon: mdi:snowflake
          - entity: sensor.warmtepomp_energie_aux_heater
            name: "4. Elektrisch Element (ZWE 6 kW)"
            icon: mdi:heating-coil
          - entity: sensor.warmtepomp_energie_circulation
            name: "5. Circulatiepompen (Zonder Compressor)"
            icon: mdi:pump
          - entity: sensor.warmtepomp_energie_standby
            name: "6. Puur Standby (Rust)"
            icon: mdi:power-sleep
      - type: entities
        title: Shelly 3-Fase Details
        show_header_toggle: false
        entities:
          - entity: sensor.energymonitor_warmtepomp_phase_a_active_power
            name: "Fase A Vermogen"
            icon: mdi:numeric-1-circle
          - entity: sensor.energymonitor_warmtepomp_phase_b_active_power
            name: "Fase B Vermogen"
            icon: mdi:numeric-2-circle
          - entity: sensor.energymonitor_warmtepomp_phase_c_active_power
            name: "Fase C Vermogen"
            icon: mdi:numeric-3-circle
          - entity: sensor.energymonitor_warmtepomp_phase_a_total_active_energy
            name: "Fase A Energie Totaal"
            icon: mdi:numeric-1-box-outline
          - entity: sensor.energymonitor_warmtepomp_phase_b_total_active_energy
            name: "Fase B Energie Totaal"
            icon: mdi:numeric-2-box-outline
          - entity: sensor.energymonitor_warmtepomp_phase_c_total_active_energy
            name: "Fase C Energie Totaal"
            icon: mdi:numeric-3-box-outline

  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: OpenEnergyMonitor Diagnostiek & Temperaturen
        icon: mdi:thermometer-lines
      - type: entities
        title: Efficiëntie & Thermische KPI's
        show_header_toggle: false
        entities:
          - entity: sensor.warmtepomp_geschatte_cop
            name: "Geschatte Real-time COP (Carnot)"
            icon: mdi:gauge
          - entity: sensor.warmtepomp_condensor_delta_t
            name: "Condensor ΔT (Aanvoer - Retour)"
            icon: mdi:thermometer-lines
          - entity: sensor.warmtepomp_bodembron_delta_t
            name: "Bodembron ΔT (Bron In - Bron Uit)"
            icon: mdi:waves-arrow-up
          - entity: sensor.warmtepomp_graaddagen_hdd18
            name: "Graaddagen Gewicht (HDD18)"
            icon: mdi:snowflake-thermometer
          - entity: sensor.warmtepomp_gemiddelde_compressor_runduur
            name: "Gemiddelde Compressor Runduur"
            icon: mdi:timer-outline
      - type: entities
        title: Temperatuursensoren
        show_header_toggle: false
        entities:
          - entity: sensor.temperatuur_woonkamer_temperature
            name: "Woonkamer Temperatuur"
            icon: mdi:home-thermometer
          - entity: sensor.luxtronik_220131_0144_outdoor_temperature
            name: "Buitentemperatuur (Actueel)"
            icon: mdi:sun-thermometer
          - entity: sensor.luxtronik_220131_0144_outdoor_temperature_average
            name: "Buitentemperatuur (Gemiddeld)"
            icon: mdi:thermometer-auto
          - entity: sensor.luxtronik_220131_0144_flow_in_temperature
            name: "CV Aanvoertemperatuur (Flow In)"
            icon: mdi:thermometer-chevron-up
          - entity: sensor.luxtronik_220131_0144_flow_out_temperature
            name: "CV Retourtemperatuur (Werkelijk)"
            icon: mdi:thermometer-chevron-down
          - entity: sensor.luxtronik_220131_0144_flow_out_temperature_target
            name: "CV Retour Doeltemperatuur (Soll)"
            icon: mdi:bullseye-arrow
          - entity: sensor.luxtronik_220131_0144_dhw_temperature
            name: "Tapwater Temperatuur (DHW Boiler)"
            icon: mdi:water-thermometer
          - entity: sensor.luxtronik_220131_0144_heat_source_input_temperature
            name: "Bodembron Inlaattemperatuur (Bron In)"
            icon: mdi:arrow-up-bold-circle-outline
          - entity: sensor.luxtronik_220131_0144_heat_source_output_temperature
            name: "Bodembron Uitlaattemperatuur (Bron Uit)"
            icon: mdi:arrow-down-bold-circle-outline
          - entity: sensor.luxtronik_220131_0144_hot_gas_temperature
            name: "Heetgastemperatuur (Compressor)"
            icon: mdi:fire

  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: Instellingen, Pompen & Draaiuren
        icon: mdi:tune
      - type: entities
        title: Stooklijn & Tapwater Parameters
        show_header_toggle: false
        entities:
          - entity: number.luxtronik_220131_0144_heating_curve_end_temperature
            name: "Stooklijn Eindpunt (-20°C)"
            icon: mdi:chart-bell-curve
          - entity: number.luxtronik_220131_0144_heating_curve_parallel_shift_temperature
            name: "Parallelverschuiving (Voetpunt)"
            icon: mdi:arrow-expand-vertical
          - entity: number.luxtronik_220131_0144_heating_target_correction
            name: "Stooklijn Correctie (RFV-DK / Offset)"
            icon: mdi:knob
          - entity: number.luxtronik_220131_0144_heating_hysteresis
            name: "Verwarmen Hysterese"
            icon: mdi:delta
          - entity: number.luxtronik_220131_0144_dhw_target_temperature
            name: "Tapwater Doeltemperatuur (DHW)"
            icon: mdi:water-boiler
          - entity: number.luxtronik_220131_0144_dhw_hysteresis
            name: "Tapwater Hysterese"
            icon: mdi:delta
          - entity: number.luxtronik_220131_0144_cooling_threshold_temperature
            name: "Koelen Buitentemp Drempel"
            icon: mdi:snowflake-thermometer
      - type: entities
        title: Relais & Pompen
        show_header_toggle: false
        entities:
          - entity: binary_sensor.luxtronik_220131_0144_compressor
            name: "Compressor 1 Actief"
            icon: mdi:engine
          - entity: binary_sensor.luxtronik_220131_0144_circulation_pump_heating
            name: "CV Circulatiepomp (HUP)"
            icon: mdi:pump
          - entity: binary_sensor.luxtronik_220131_0144_additional_circulation_pump
            name: "Vloerverwarming Pomp (ZUP)"
            icon: mdi:pump
          - entity: binary_sensor.luxtronik_220131_0144_dhw_charging_pump
            name: "Tapwater Laadpomp (BUP)"
            icon: mdi:pump
          - entity: binary_sensor.luxtronik_220131_0144_additional_heat_generator
            name: "Elektrisch Element Actief (ZWE)"
            icon: mdi:heating-coil
          - entity: binary_sensor.luxtronik_220131_0144_approval_cooling
            name: "Vrijgave Passief Koelen"
            icon: mdi:snowflake-check
          - entity: binary_sensor.luxtronik_220131_0144_evu_unlocked
            name: "EVU Vrijgave (Geen Netblokkade)"
            icon: mdi:power-plug
      - type: entities
        title: Draaiuren, Starts & Systeem
        show_header_toggle: false
        entities:
          - entity: sensor.luxtronik_220131_0144_compressor1_impulses
            name: "Compressor Starts (Impulsen)"
            icon: mdi:counter
          - entity: sensor.luxtronik_220131_0144_compressor1_operation_hours
            name: "Draaiuren Compressor Totaal"
            icon: mdi:clock-outline
          - entity: sensor.luxtronik_220131_0144_operation_hours_heating
            name: "Draaiuren Verwarmen"
            icon: mdi:radiator
          - entity: sensor.luxtronik_220131_0144_dhw_operation_hours
            name: "Draaiuren Warm Tapwater"
            icon: mdi:water-boiler
          - entity: sensor.luxtronik_220131_0144_operation_hours_cooling
            name: "Draaiuren Passief Koelen"
            icon: mdi:snowflake
          - entity: sensor.luxtronik_220131_0144_additional_heat_generator_operation_hours
            name: "Draaiuren Elektrisch Element (ZWE)"
            icon: mdi:lightning-bolt
          - entity: update.luxtronik_220131_0144_firmware
            name: "Luxtronik Firmware Versie"
            icon: mdi:chip
          - entity: sensor.luxtronik_220131_0144_error_reason
            name: "Laatste Storingscode"
            icon: mdi:alert-circle-outline
